bank:
  host:
    baseurl: http://${BANK_WITH_PORT:localhost:9090}

gate:
  instances:
    "gate-1": "http://${DOOR_WITH_PORT:localhost:8082}"
    "gate-2": "http://${DOOR_2_WITH_PORT:localhost:8084}"

display:
  host:
    baseurl: http://${DISPLAY_WITH_PORT:localhost:8083}

# Property to set the visible level on all logs (OFF will turn off all of them)
# logging:
#   level:
#     root: OFF

springdoc:
  swagger-ui:
    path: /doc

# postgres DB # IN DOCKER COMPOSE SHOULD BE OVERRIDEN BY ENV VARIABLES

spring:
  datasource:
    # POSTGRES_USER
    username: postgresuser
    # POSTGRES_PASSWORD
    password: postgrespass
    url: jdbc:postgresql://${POSTGRES_HOST:localhost:5432}/tcf-db
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    generate-ddl: true
    open-in-view: false
