services:
  tcf-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: skimaster-0.0.1-SNAPSHOT.jar
    image: team-k/tcf-spring-backend:local
    container_name: backend3
    ports:
      - "8080:8080"
    environment:
      - BANK_WITH_PORT=bank-system:9090
      - POSTGRES_HOST=postgres:5432
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,mappings
      - DOOR_WITH_PORT=door-1:8082
      - DOOR_2_WITH_PORT=door-2:8082
      - DOOR_3_WITH_PORT=door-3:8082
      - DOOR_4_WITH_PORT=door-4:8082
      - DISPLAY_WITH_PORT=display-service:8083
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      bank-system:
        condition: service_healthy
      door-1:
        condition: service_started
      door-2:
        condition: service_started
    healthcheck:
      test: "curl --silent --fail localhost:8080/actuator/health | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18.1
    container_name: db2
    environment:
      - POSTGRES_PASSWORD=postgrespass
      - POSTGRES_USER=postgresuser
      - POSTGRES_DB=tcf-db
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d tcf-db -U $$POSTGRES_USER" ]
      interval: 5s
      timeout: 3s
      retries: 3

  tcf-cli:
    image: team-k/tcf-spring-cli:local
    container_name: cli
    environment:
      - SERVER_WITH_PORT=tcf-server:8080
    depends_on:
      tcf-server:
        condition: service_healthy
    volumes:
      - ./cli/demo.txt:/opt/app/demo.txt
    stdin_open: true
    tty: true

  bank-system:
    image: pcollet/tcf-bank-service
    container_name: bank2
    ports:
      - "9090:9090"
    healthcheck:
      test: [ "CMD", "/nodejs/bin/node" , "healthcheck.js" ]
      interval: 5s
      timeout: 3s
      retries: 3

  door-1:
    image: skimaster-door:latest
    container_name: door-1
    build: ./door
    ports:
      - "8082:8082"
    environment:
      - GATE_ID=gate-1
      - SERVER_PORT=8082
    healthcheck:
      test: "curl --silent --fail localhost:8082/gate/status || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5

  door-2:
    image: skimaster-door:latest
    container_name: door-2
    ports:
      - "8084:8082"
    environment:
      - GATE_ID=gate-2
      - SERVER_PORT=8082
    healthcheck:
      test: "curl --silent --fail localhost:8082/gate/status || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5

  door-3:
    image: skimaster-door:latest
    container_name: door-3
    ports:
      - "8085:8082"
    environment:
      - GATE_ID=gate-3
      - SERVER_PORT=8082
    healthcheck:
      test: "curl --silent --fail localhost:8082/gate/status || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5

  door-4:
    image: skimaster-door:latest
    container_name: door-4
    ports:
      - "8086:8082"
    environment:
      - GATE_ID=gate-4
      - SERVER_PORT=8082
    healthcheck:
      test: "curl --silent --fail localhost:8082/gate/status || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5

  display-service:
    image: skimaster-display:latest
    container_name: display
    build: ./display
    ports:
      - "8083:8083"
    healthcheck:
      test: "curl --silent --fail localhost:8083/display/alerts || exit 1"
      interval: 5s
      timeout: 3s
      retries: 3
