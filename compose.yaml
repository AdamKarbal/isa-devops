services:
  # The Cookie Factory backend in SpringBoot
  tcf-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: skimaster-0.0.1-SNAPSHOT.jar
    image: tcf-spring-backend:local
    container_name: backend3
    ports:
      - "8080:8080"
    environment:
      - BANK_WITH_PORT=bank-system:9090
      - POSTGRES_HOST=postgres:5432
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,mappings
      - DOOR_WITH_PORT=door-service:8082
      - DISPLAY_WITH_PORT=display-service:8083
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      door-service:
        condition: service_healthy
      display-service:
        condition: service_healthy
      bank-system:
        condition: service_healthy
    healthcheck:
      test: "curl --silent --fail localhost:8080/actuator/health | grep UP || exit 1"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  # the postgres DB to be connected to the backend (watch out: no volume specified, everything can be lost)
  postgres:
    image: postgres:18.1
    container_name: db
    environment:
      - POSTGRES_PASSWORD=postgrespass
      - POSTGRES_USER=postgresuser
      - POSTGRES_DB=tcf-db
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d tcf-db -U $$POSTGRES_USER" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # A simple java CLI
  tcf-cli:
    image: pcollet/tcf-spring-cli
    container_name: cli
    environment:
      - SERVER_WITH_PORT=tcf-server:8080
    depends_on:
      tcf-server:
        condition: service_healthy
    volumes:
      - ./cli/demo.txt:/opt/app/demo.txt
    stdin_open: true
    tty: true
    healthcheck:
      test: "curl --silent --fail localhost:8081/actuator/health | grep UP || exit 1"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # An external bank service in NestJs
  bank-system:
    image: pcollet/tcf-bank-service
    container_name: bank
    ports:
      - "9090:9090"
    healthcheck:
      test: [ "CMD", "/nodejs/bin/node" , "healthcheck.js" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  door-service:
    image: skimaster-door:latest
    container_name: door
    build :
      context : ./door
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    healthcheck:
      test: "curl --silent --fail localhost:8082/gate/status || exit 1"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  display-service:
    image: skimaster-display:latest
    container_name: display
    build:
      context: ./display
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    healthcheck:
      test: "curl --silent --fail localhost:8083/display/alerts || exit 1"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
