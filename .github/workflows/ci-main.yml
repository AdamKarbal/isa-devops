name: CI PR Main
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run CLI demo script tests with socat
        run: |
          chmod +x .github/scripts/run-cli-demo.sh
          .github/scripts/run-cli-demo.sh /tmp/cli-demo-main.log

      - name : Run All Tests (Only Unit)
        run: |
          chmod +x ./mvnw
          ./mvnw clean test
        working-directory: backend





