name: CI PR Main
on:
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name : Run All Tests (Only Unit)
        run: |
          chmod +x ./mvnw
          ./mvnw clean test
        working-directory: backend
