name: CI PR Main
on:
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name : Run All Tests (Only Unit)
        run: |
          chmod +x ./mvnw
          ./mvnw clean test
        working-directory: backend
  test-e2e:
    name: End-to-End Tests
    runs-on: self-hosted
    needs: [test-backend]

    steps:
      - uses: actions/checkout@v4

      - name: Build and Start Infrastructure
        run:
          docker compose up --build -d

      - name: Run E2E Script
        run: |
          chmod +x ./e2e.sh
          ./e2e.sh

      - name: Cleanup
        if: always()
        run: docker compose down
