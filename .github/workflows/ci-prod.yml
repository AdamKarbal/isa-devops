name: CI PR Prod
on:
  pull_request:
    branches: [prod]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name : Setup Environment
        uses : ./.github/actions/setup-env

      - name : Run All Tests (Unit + Integration)
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify
        working-directory: backend
      - name: Run CLI demo script tests with socat
        run: |
          chmod +x .github/scripts/run-cli-demo.sh
          .github/scripts/run-cli-demo.sh /tmp/cli-demo-main.log

      - name: Cleanup docker compose
        if: always()
        run: docker compose down -v --remove-orphans




