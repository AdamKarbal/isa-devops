name: CI PR Prod
on:
  pull_request:
    branches: [prod]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name : Setup Environment
        uses : ./.github/actions/setup-env

      - name : Run All Tests (Unit + Integration)
        run: |
          cd backend
          mvn clean verify




