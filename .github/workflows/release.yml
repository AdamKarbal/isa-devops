name: Release Manager
on:
  pull_request:
    branches:
      - main
      - prod
    types: [closed]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Calculate Version Increment
        id: vars
        shell: bash
        run: |
          DEST_BRANCH="${{ github.base_ref }}"
          SRC_BRANCH="${{ github.event.pull_request.head.ref }}"
          
          echo "Merging $SRC_BRANCH into $DEST_BRANCH"
          
          if [[ "$DEST_BRANCH" == "main" ]]; then
            case "$SRC_BRANCH" in
              feat/*|feature/*)
                echo "inc=minor" >> $GITHUB_OUTPUT
                ;;
              fix/*)
                echo "inc=patch" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "inc=patch" >> $GITHUB_OUTPUT
                ;;
            esac
          elif [[ "$DEST_BRANCH" == "prod" && "$SRC_BRANCH" == "main" ]]; then
            echo "inc=major" >> $GITHUB_OUTPUT
          else
            echo "inc=patch" >> $GITHUB_OUTPUT
          fi
      - name: Run Release-it
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npm run release -- ${{ steps.vars.outputs.inc }} --ci

  build-images:
    runs-on: self-hosted
    needs: release
    if: github.event.pull_request.merged == true # TODO : rajouter && github.base_ref == 'prod' une fois les tests finis
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags

      - name: Compute image tags (sha + version)
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          VERSION_TAG="$(git describe --tags --abbrev=0)"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

          echo "sha_tag=sha-${SHORT_SHA}"
          echo "version_tag=${VERSION_TAG}"

      - name: Login to Docker Hub
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u ismakhil --password-stdin

      - name: Build images (latest)
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg JAR_FILE=door-0.0.1-SNAPSHOT.jar \
            -t ismakhil/skimaster-door:latest ./door

          docker build --build-arg JAR_FILE=skimaster-0.0.1-SNAPSHOT.jar \
            -t ismakhil/tcf-spring-backend:latest ./backend

          docker build --build-arg JAR_FILE=cli-0.0.1-SNAPSHOT.jar \
            -t ismakhil/tcf-spring-cli:latest ./cli

      - name: Tag images (sha + version)
        shell: bash
        run: |
          set -euo pipefail
          VERSION_TAG="${{ steps.meta.outputs.version_tag }}"

          for img in \
            ismakhil/skimaster-door \
            ismakhil/tcf-spring-backend \
            ismakhil/tcf-spring-cli
          do
            docker tag "${img}:latest" "${img}:${VERSION_TAG}"
          done

      - name: Push images (latest + sha + version)
        shell: bash
        run: |
          set -euo pipefail
          SHA_TAG="${{ steps.meta.outputs.sha_tag }}"
          VERSION_TAG="${{ steps.meta.outputs.version_tag }}"

          for img in \
            ismakhil/skimaster-door \
            ismakhil/tcf-spring-backend \
            ismakhil/tcf-spring-cli
          do
            docker push "${img}:latest"
            docker push "${img}:${VERSION_TAG}"
          done




