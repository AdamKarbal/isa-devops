name: Release Manager
on:
  pull_request:
    branches:
      - main
      - prod
    types: [closed]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Calculate Version Increment
        id: vars
        shell: bash
        run: |
          DEST_BRANCH="${{ github.base_ref }}"
          SRC_BRANCH="${{ github.event.pull_request.head.ref }}"
          
          echo "Merging $SRC_BRANCH into $DEST_BRANCH"
          
          if [[ "$DEST_BRANCH" == "main" ]]; then
            case "$SRC_BRANCH" in
              feat/*|feature/*)
                echo "inc=minor" >> $GITHUB_OUTPUT
                ;;
              fix/*)
                echo "inc=patch" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "inc=patch" >> $GITHUB_OUTPUT
                ;;
            esac
          elif [[ "$DEST_BRANCH" == "prod" && "$SRC_BRANCH" == "main" ]]; then
            echo "inc=major" >> $GITHUB_OUTPUT
          else
            echo "inc=patch" >> $GITHUB_OUTPUT
          fi
      - name: Run Release-it
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npm run release -- ${{ steps.vars.outputs.inc }} --ci

  build-images:
    runs-on: self-hosted
    if: github.event.pull_request.merged == true
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: build-images
        shell: bash
        run: |
          set -e
          docker build --build-arg JAR_FILE=door-0.0.1-SNAPSHOT.jar -t team-k/skimaster-door:latest ./door
          docker build --build-arg JAR_FILE=skimaster-0.0.1-SNAPSHOT.jar -t team-k/tcf-spring-backend:latest ./backend
          docker build --build-arg JAR_FILE=cli-0.0.1-SNAPSHOT.jar -t team-k/tcf-spring-cli:latest ./cli

      - name: push-images
        shell: bash
        run: |
          set -e
          docker login -u ismakhil -p ${{secrets.DOCKER_HUB_TOKEN}}
          docker push team-k/skimaster-door:latest
          docker push team-k/tcf-spring-backend:latest
          docker push team-k/tcf-spring-cli:latest




