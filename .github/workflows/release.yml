name: Release Manager
on:
  pull_request:
    branches:
      - main
      - prod
    types: [closed]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Calculate Version Increment
        id: vars
        shell: bash
        run: |
          DEST_BRANCH="${{ github.base_ref }}"
          SRC_BRANCH="${{ github.event.pull_request.head.ref }}"
          
          echo "Merging $SRC_BRANCH into $DEST_BRANCH"
          
          if [[ "$DEST_BRANCH" == "main" ]]; then
            case "$SRC_BRANCH" in
              feat/*|feature/*)
                echo "inc=minor" >> $GITHUB_OUTPUT
                ;;
              fix/*)
                echo "inc=patch" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "inc=patch" >> $GITHUB_OUTPUT
                ;;
            esac
          elif [[ "$DEST_BRANCH" == "prod" && "$SRC_BRANCH" == "main" ]]; then
            echo "inc=major" >> $GITHUB_OUTPUT
          else
            echo "inc=patch" >> $GITHUB_OUTPUT
          fi
      - name: Run Release-it
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" https://api.github.com/app
          git remote set-url origin https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git
          npm run release -- ${{ steps.vars.outputs.inc }} --ci



