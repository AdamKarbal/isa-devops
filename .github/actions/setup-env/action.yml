name: 'Setup Java and Maven'
description: 'Prepare the environment for SkiMaster'
runs:
  using: "composite"
  steps:

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Node Dependencies
      shell: bash
      run: npm ci
